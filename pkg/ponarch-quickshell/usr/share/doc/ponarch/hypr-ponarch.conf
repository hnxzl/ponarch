# Ponarch — tempel ke hyprland.conf (atau source file ini)

# Super+Shift+J: ganti Waybar penuh <-> Ponarch (menggantikan toggle-mode.fish yang lama)
bind = SUPER SHIFT, J, exec, ponarch mode
# Alt+N: buka/tutup notch
bind = ALT, N, exec, ponarch notch
# Super+Alt+L: buka/tutup LocalSend
bind = SUPER ALT, L, exec, ponarch localsend

# Glassmorphism: blur layer Ponarch and include translucent pixels.
# Hyprland 0.56+ uses the effect-only syntax below.
layerrule = blur, match:namespace ponarch
layerrule = ignore_alpha 0.05, match:namespace ponarch
